<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
  <title id="title">Dupi-RAG 企业级分层技术架构</title>
  <desc id="desc">客户端、接入、业务、数据和基础设施五层架构，覆盖异步文档摄入和在线 RAG 问答链路。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#203047" stroke-width=".7"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#61c7ff"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#52d6a3"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#ffb454"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif}.title{font-size:29px;font-weight:700;fill:#f7fbff}.sub{font-size:13px;fill:#9eb2ca}.layer{font-size:15px;font-weight:700;letter-spacing:1px}.boxTitle{font-size:14px;font-weight:700;fill:#f4f8fc}.boxText{font-size:11px;fill:#b5c5d8}.tiny{font-size:10px;fill:#91a6bd}.note{font-size:11px;fill:#d5e1ed}.tag{font-size:10px;font-weight:700}.flow{font-size:10px;font-weight:700;fill:#8ed8ff}
    </style>
  </defs>
  <rect width="1680" height="1220" fill="#0b1220"/><rect width="1680" height="1220" fill="url(#grid)"/>
  <rect x="28" y="20" width="1624" height="70" rx="12" fill="#101d30" stroke="#2e4967"/>
  <text x="58" y="55" class="title">Dupi-RAG 企业级知识库平台 · 目标技术架构</text>
  <text x="58" y="77" class="sub">基于当前代码实现：React / Nginx / Spring Boot / Python Worker / PostgreSQL / Redis / Milvus / MinIO</text>
  <g transform="translate(1300,38)"><rect width="108" height="30" rx="15" fill="#123c42" stroke="#35d2b1"/><text x="54" y="20" text-anchor="middle" class="tag" fill="#6aefd1">已实现主干</text><rect x="120" width="108" height="30" rx="15" fill="#392b13" stroke="#f2b34d"/><text x="174" y="20" text-anchor="middle" class="tag" fill="#ffd081">生产增强项</text></g>

  <!-- layer regions -->
  <g fill="#0e1a2b" fill-opacity=".82" stroke-width="1.2" stroke-dasharray="7 5">
    <rect x="28" y="112" width="1624" height="130" rx="14" stroke="#37b9e9"/><rect x="28" y="258" width="1624" height="120" rx="14" stroke="#37b9e9"/>
    <rect x="28" y="394" width="1624" height="315" rx="14" stroke="#49c998"/><rect x="28" y="725" width="1624" height="190" rx="14" stroke="#a886ee"/><rect x="28" y="931" width="1624" height="220" rx="14" stroke="#f1b34e"/>
  </g>
  <g class="layer"><text x="48" y="139" fill="#59c8f5">01 · 客户端层</text><text x="48" y="285" fill="#59c8f5">02 · 接入层</text><text x="48" y="421" fill="#62dca8">03 · 业务服务层</text><text x="48" y="752" fill="#b292ff">04 · 数据与智能层</text><text x="48" y="958" fill="#ffc460">05 · 基础设施与治理层</text></g>

  <!-- connectors first -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 205V300H382" stroke="#61c7ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/><path d="M600 205V300H540" stroke="#61c7ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/><path d="M900 205V300H700" stroke="#61c7ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
    <path d="M540 340V455" stroke="#61c7ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/><path d="M700 340V455" stroke="#61c7ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/>
    <path d="M520 570H785" stroke="#61c7ff" stroke-width="2" marker-end="url(#arrowBlue)"/><path d="M995 570H1120" stroke="#ffb454" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arrowOrange)"/>
    <path d="M1215 625V790" stroke="#52d6a3" stroke-width="2.3" marker-end="url(#arrowGreen)"/><path d="M1215 855V895H985" stroke="#52d6a3" stroke-width="2.3" marker-end="url(#arrowGreen)"/>
    <path d="M920 625V785" stroke="#52d6a3" stroke-width="2" marker-end="url(#arrowGreen)"/><path d="M600 625V785" stroke="#52d6a3" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M760 625V680H425V785" stroke="#52d6a3" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M1060 570V1020H820" stroke="#ffb454" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
    <path d="M1310 570V1020H1430" stroke="#ffb454" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="550" y="294" class="flow">HTTPS / SSE</text><text x="1006" y="558" class="flow">事务 Outbox</text><text x="1230" y="720" class="flow">异步任务</text><text x="1090" y="1008" class="flow">指标 / 日志 / 审计</text>

  <!-- client -->
  <g filter="url(#shadow)"><rect x="150" y="157" width="230" height="52" rx="9" fill="#11334a" stroke="#4cc7f4"/><text x="265" y="180" text-anchor="middle" class="boxTitle">业务用户 / 知识运营</text><text x="265" y="198" text-anchor="middle" class="boxText">浏览器 · 文档上传 · 智能问答</text>
    <rect x="450" y="157" width="230" height="52" rx="9" fill="#11334a" stroke="#4cc7f4"/><text x="565" y="180" text-anchor="middle" class="boxTitle">运营与安全管理员</text><text x="565" y="198" text-anchor="middle" class="boxText">账号 · 角色 · 审计 · 评估</text>
    <rect x="750" y="157" width="230" height="52" rx="9" fill="#11334a" stroke="#4cc7f4"/><text x="865" y="180" text-anchor="middle" class="boxTitle">开放 API / 外部系统</text><text x="865" y="198" text-anchor="middle" class="boxText">系统集成 · Webhook · SDK</text></g>
  <!-- access -->
  <g filter="url(#shadow)"><rect x="380" y="300" width="320" height="54" rx="9" fill="#11334a" stroke="#4cc7f4"/><text x="540" y="324" text-anchor="middle" class="boxTitle">WAF · CDN · SLB / Ingress</text><text x="540" y="343" text-anchor="middle" class="boxText">TLS 卸载 · 限流 · 黑白名单 · 防护</text>
    <rect x="760" y="300" width="320" height="54" rx="9" fill="#11334a" stroke="#4cc7f4"/><text x="920" y="324" text-anchor="middle" class="boxTitle">Nginx + React SPA（Web）</text><text x="920" y="343" text-anchor="middle" class="boxText">静态资源 · /api 反向代理 · SSE 长连接</text>
    <rect x="1140" y="300" width="280" height="54" rx="9" fill="#382510" stroke="#f2b34d"/><text x="1280" y="324" text-anchor="middle" class="boxTitle">API 网关（生产建议）</text><text x="1280" y="343" text-anchor="middle" class="boxText">鉴权 · 路由 · 灰度 · 统一协议治理</text></g>
  <!-- business -->
  <g filter="url(#shadow)"><rect x="275" y="455" width="245" height="116" rx="10" fill="#123d35" stroke="#4ad39a"/><text x="398" y="481" text-anchor="middle" class="boxTitle">身份与租户中心</text><text x="398" y="503" text-anchor="middle" class="boxText">登录 / JWT / API Key</text><text x="398" y="522" text-anchor="middle" class="boxText">RBAC · KB 资源级授权</text><text x="398" y="544" text-anchor="middle" class="boxText">配额、上传限流与幂等</text>
    <rect x="555" y="455" width="240" height="116" rx="10" fill="#123d35" stroke="#4ad39a"/><text x="675" y="481" text-anchor="middle" class="boxTitle">知识库与文档服务</text><text x="675" y="503" text-anchor="middle" class="boxText">KB / 文档 CRUD · 上传</text><text x="675" y="522" text-anchor="middle" class="boxText">版本、删除墓碑、重建索引</text><text x="675" y="544" text-anchor="middle" class="boxText">恢复 / 导入 / 导出</text>
    <rect x="830" y="455" width="245" height="116" rx="10" fill="#123d35" stroke="#4ad39a"/><text x="953" y="481" text-anchor="middle" class="boxTitle">RAG 编排与对话服务</text><text x="953" y="503" text-anchor="middle" class="boxText">检索 Profile · Hybrid / RRF</text><text x="953" y="522" text-anchor="middle" class="boxText">Prompt 编排 · SSE 流式响应</text><text x="953" y="544" text-anchor="middle" class="boxText">评估、质量门禁、回退</text>
    <rect x="1120" y="455" width="245" height="116" rx="10" fill="#402a12" stroke="#ffb454"/><text x="1243" y="481" text-anchor="middle" class="boxTitle">摄入任务与运营服务</text><text x="1243" y="503" text-anchor="middle" class="boxText">事务 Outbox · 任务状态机</text><text x="1243" y="522" text-anchor="middle" class="boxText">失败重试 · 死信 · Webhook</text><text x="1243" y="544" text-anchor="middle" class="boxText">审计告警 · 定时补偿</text>
    <rect x="1430" y="455" width="165" height="116" rx="10" fill="#402a12" stroke="#ffb454"/><text x="1512" y="481" text-anchor="middle" class="boxTitle">模型服务</text><text x="1512" y="505" text-anchor="middle" class="boxText">LLM Chat</text><text x="1512" y="526" text-anchor="middle" class="boxText">Embedding</text><text x="1512" y="547" text-anchor="middle" class="boxText">Reranker</text></g>
  <rect x="275" y="595" width="1088" height="72" rx="10" fill="#123d35" stroke="#4ad39a" stroke-dasharray="5 4"/><text x="303" y="621" class="boxTitle">Python Worker 异步处理集群</text><text x="303" y="645" class="boxText">PDF / DOCX / XLSX / Markdown 解析 → 分块（递归 / 语义 / 父子）→ Embedding → 稠密 / 稀疏索引；QA 辅助索引与 Rerank 模型预热</text>
  <!-- data -->
  <g filter="url(#shadow)"><rect x="255" y="785" width="250" height="86" rx="10" fill="#33235a" stroke="#ad8cff"/><text x="380" y="813" text-anchor="middle" class="boxTitle">PostgreSQL 主数据</text><text x="380" y="835" text-anchor="middle" class="boxText">KB / 文档 / 用户角色 / 会话</text><text x="380" y="854" text-anchor="middle" class="boxText">Outbox · 审计 · 评估 · 恢复元数据</text>
    <rect x="570" y="785" width="250" height="86" rx="10" fill="#33235a" stroke="#ad8cff"/><text x="695" y="813" text-anchor="middle" class="boxTitle">Redis 缓存与消息队列</text><text x="695" y="835" text-anchor="middle" class="boxText">摄入队列 / Processing / DLQ</text><text x="695" y="854" text-anchor="middle" class="boxText">限流、取消信号、热点缓存</text>
    <rect x="885" y="785" width="250" height="86" rx="10" fill="#33235a" stroke="#ad8cff"/><text x="1010" y="813" text-anchor="middle" class="boxTitle">Milvus 向量检索</text><text x="1010" y="835" text-anchor="middle" class="boxText">Dense ANN · BM25 Sparse</text><text x="1010" y="854" text-anchor="middle" class="boxText">Profile 版本化集合 · 过滤检索</text>
    <rect x="1200" y="785" width="250" height="86" rx="10" fill="#33235a" stroke="#ad8cff"/><text x="1325" y="813" text-anchor="middle" class="boxTitle">MinIO 对象存储</text><text x="1325" y="835" text-anchor="middle" class="boxText">原始文档 / 归档 / Manifest</text><text x="1325" y="854" text-anchor="middle" class="boxText">模型缓存与备份快照</text></g>
  <!-- infra -->
  <g filter="url(#shadow)"><rect x="170" y="1002" width="250" height="90" rx="10" fill="#402a12" stroke="#ffb454"/><text x="295" y="1029" text-anchor="middle" class="boxTitle">容器与弹性计算</text><text x="295" y="1051" text-anchor="middle" class="boxText">Docker Compose（当前）</text><text x="295" y="1070" text-anchor="middle" class="boxText">Kubernetes / HPA（生产）</text>
    <rect x="465" y="1002" width="250" height="90" rx="10" fill="#402a12" stroke="#ffb454"/><text x="590" y="1029" text-anchor="middle" class="boxTitle">配置与密钥中心</text><text x="590" y="1051" text-anchor="middle" class="boxText">环境配置 / 动态开关</text><text x="590" y="1070" text-anchor="middle" class="boxText">KMS / Vault · 密钥轮换</text>
    <rect x="760" y="1002" width="250" height="90" rx="10" fill="#402a12" stroke="#ffb454"/><text x="885" y="1029" text-anchor="middle" class="boxTitle">可观测性平台</text><text x="885" y="1051" text-anchor="middle" class="boxText">Prometheus · Grafana · Trace</text><text x="885" y="1070" text-anchor="middle" class="boxText">SLO / 告警 / 容量观测</text>
    <rect x="1055" y="1002" width="250" height="90" rx="10" fill="#402a12" stroke="#ffb454"/><text x="1180" y="1029" text-anchor="middle" class="boxTitle">日志与审计平台</text><text x="1180" y="1051" text-anchor="middle" class="boxText">OpenTelemetry · ELK / Loki</text><text x="1180" y="1070" text-anchor="middle" class="boxText">traceId · 操作审计 · 检索日志</text>
    <rect x="1350" y="1002" width="250" height="90" rx="10" fill="#402a12" stroke="#ffb454"/><text x="1475" y="1029" text-anchor="middle" class="boxTitle">DevSecOps 与容灾</text><text x="1475" y="1051" text-anchor="middle" class="boxText">CI/CD · 镜像扫描 · 灰度</text><text x="1475" y="1070" text-anchor="middle" class="boxText">备份 · 跨域复制 · 演练</text></g>
  <rect x="170" y="1110" width="1430" height="24" rx="6" fill="#1a2637"/><text x="885" y="1127" text-anchor="middle" class="tiny">横向治理：多租户隔离 · RBAC / API Key / 内部密钥 · 传输与存储加密 · 限流熔断 · 审计留存 · 质量评估与发布门禁</text>
  <text x="40" y="1192" class="tiny">实线：同步/数据访问主链路　　虚线：异步事件、监控与治理链路　　目标：支持高并发问答、可靠摄入、可追溯运维与可演进部署</text>
</svg>
